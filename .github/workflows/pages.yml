# Deploy محفظة جيب to GitHub Pages

name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site (web/ folder, slim — no large files)
        id: deploy
        shell: bash
        run: |
          if [ -f docs/index.html ]; then
            root=docs
          elif [ -f web/index.html ]; then
            root=web
          elif [ -f simple/index.html ]; then
            root=simple
          else
            root=.
          fi
          mkdir -p _site
          cp -r "$root"/. _site/
          rm -f _site/templates-base64.js 2>/dev/null || true
          rm -rf _site/templates-data _site/templates _site/fonts 2>/dev/null || true
          rm -f _site/prepare-web.ps1 _site/README.md _site/vercel.json 2>/dev/null || true
          echo "Deploying from $root — $(find _site -type f | wc -l) files"
          ls -la _site/
          echo "path=_site" >> "$GITHUB_OUTPUT"

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.deploy.outputs.path }}

      - id: deployment
        uses: actions/deploy-pages@v4
